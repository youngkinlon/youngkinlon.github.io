<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Papers read by JinLong Yang, with short reading notes.">
  <meta name="theme-color" content="#ffffff">
  <title>{{ page.title | escape }} | JinLong Yang</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <div class="page">
    <header class="site-header">
      <div class="identity">
        <h1>{{ page.title | escape }}</h1>
        <p>JinLong Yang</p>
      </div>

      <nav class="site-nav" aria-label="Primary navigation">
        <a href="../#bio">Bio</a>
        <a href="../#publications">Publications</a>
        <a href="../#under-review">Under Review</a>
        <a href="./" aria-current="page">Reading List</a>
      </nav>
    </header>

    <main>
      <section aria-label="Papers I have read">
        <p class="reading-intro">Papers I’ve read, with brief notes on what I found useful.</p>

        {% assign notes = content | strip %}
        {% if notes == empty %}
          <p class="reading-empty">No papers added yet.</p>
        {% else %}
          <div class="reading-notes">{{ content }}</div>
        {% endif %}
      </section>
    </main>

    <footer>
      © 2026 JinLong Yang
    </footer>
  </div>
</body>
</html>
